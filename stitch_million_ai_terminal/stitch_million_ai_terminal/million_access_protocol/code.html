<style>

<body class="font-body-lg text-on-background h-screen w-screen overflow-hidden flex items-center justify-center crt">
<!-- Top Navigation Suppressed for Transactional Authentication Flow -->
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl px-margin-mobile md:px-margin-desktop z-10">
<!-- Terminal Window Encapsulation -->
<div class="border border-primary-fixed-dim bg-black p-unit-8 flex flex-col gap-unit-8">
<!-- Header / Status -->
<div class="border-b border-outline-variant pb-unit-4 flex justify-between items-center">
<span class="font-label-caps text-label-caps text-primary-fixed-dim">SYS_AUTH_NODE</span>
<span class="font-code-snippet text-code-snippet text-on-surface-variant flex items-center gap-unit-2">
<span class="material-symbols-outlined text-[16px] text-primary-fixed-dim" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
                    SECURE CONNECTION
                </span>
</div>
<!-- Content Area -->
<div class="flex flex-col gap-unit-4 pt-unit-4">
<p class="font-headline-md text-headline-md text-primary-fixed-dim uppercase">SECURITY PROTOCOL: ENTER UNIQUE ACCESS CODE</p>
<div class="mt-unit-8">
<form action="#" class="flex flex-col gap-unit-8" id="authForm" method="POST">
<!-- Command Prompt Input -->
<div class="flex items-center border-b border-outline-variant focus-within:border-primary-fixed-dim pb-unit-2 transition-colors">
<span class="font-headline-lg text-headline-lg text-primary-fixed-dim mr-unit-2">&gt;</span>
<div class="relative flex-grow">
<input autocomplete="off" autofocus="" class="w-full bg-transparent border-none text-primary-fixed-dim font-headline-lg text-headline-lg p-0 focus:ring-0 placeholder-transparent tracking-[0.2em]" id="accessCode" required="" type="password"/>
<span class="absolute left-0 top-1/2 -translate-y-1/2 text-primary-fixed-dim font-headline-lg text-headline-lg pointer-events-none" id="maskDisplay"></span>
<span class="blinking-cursor absolute top-1/2 -translate-y-1/2" id="cursorElem"></span>
</div>
</div>
<!-- Action -->
<div class="flex justify-end mt-unit-4">
<button class="bg-black border border-primary-fixed-dim text-primary-fixed-dim font-label-caps text-label-caps px-unit-8 py-unit-4 hover:bg-primary-fixed-dim hover:text-black transition-colors duration-100 flex items-center gap-unit-2" type="submit">
                                [ EXECUTE ]
                                <span class="material-symbols-outlined text-[16px]" data-icon="terminal">terminal</span>
</button>
</div>
</form>
</div>
</div>
<!-- Terminal Footer Output Simulation -->
<div class="mt-unit-8 pt-unit-4 border-t border-outline-variant font-code-snippet text-code-snippet text-on-surface-variant opacity-50 flex flex-col gap-1">
<p>&gt; INIT SECURE HANDSHAKE...</p>
<p>&gt; AWAITING INPUT...</p>
</div>
</div>
</main>
<!-- Footer: Static Data Ticker -->
<footer class="fixed bottom-0 w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop py-unit-2 z-50 border-t border-outline-variant bg-black">
<span class="font-code-snippet text-code-snippet uppercase text-on-surface-variant">AI: ONLINE // MARKET: LIVE // SYS_REF: 0x71C</span>
<span class="font-label-caps text-label-caps text-primary-fixed-dim">MILLION</span>
</footer>
<script>
        // Custom Password Masking & Cursor Logic to maintain Terminal Aesthetic
        const input = document.getElementById('accessCode');
        const display = document.getElementById('maskDisplay');
        const cursor = document.getElementById('cursorElem');
        const form = document.getElementById('authForm');

        function updateDisplay() {
            const val = input.value;
            // Mask with asterisks
            const masked = '*'.repeat(val.length);
            display.textContent = masked;
            
            // Move cursor to end of text
            // Hacky approximation of character width for JetBrains Mono at headline-lg size
            const charWidth = 20; // Adjust based on exact rendered width
            const newLeft = val.length * charWidth + (val.length > 0 ? 8 : 0);
            cursor.style.left = `${newLeft}px`;
        }

        input.addEventListener('input', updateDisplay);
        
        // Hide default input text completely
        input.style.color = 'transparent';

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate processing
            const originalText = document.querySelector('button[type="submit"]').innerHTML;
            document.querySelector('button[type="submit"]').innerHTML = '[ VERIFYING... ]';
            document.querySelector('button[type="submit"]').classList.add('bg-primary-fixed-dim', 'text-black');
            
            setTimeout(() => {
                // Reset for demo purposes
                input.value = '';
                updateDisplay();
                document.querySelector('button[type="submit"]').innerHTML = originalText;
                document.querySelector('button[type="submit"]').classList.remove('bg-primary-fixed-dim', 'text-black');
                
                // Add log output
                const logArea = document.querySelector('.mt-unit-8.pt-unit-4.border-t');
                const newLog = document.createElement('p');
                newLog.textContent = '> AUTH FAILED: INVALID CREDENTIALS';
                newLog.className = 'text-error';
                logArea.appendChild(newLog);
            }, 1000);
        });
    </script>
